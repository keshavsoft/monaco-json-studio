<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Monaco Studio v5 · 3 panes</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/editor/editor.main.min.css">
        <link rel="stylesheet" href="./css/base.css">
        <link rel="stylesheet" href="./css/studio.css">
        <link rel="stylesheet" href="./css/pane-layout.css">
        <link rel="stylesheet" href="./css/pane-regions.css">
    </head>
    <body>
        <div class="studio-app">
            <header class="studio-header">
                <div class="header-left">
                    <a href="#" class="brand-link" title="Monaco Studio">
                        <i class="bi bi-cpu-fill brand-icon"></i>
                        <span>Monaco Studio</span>
                        <span class="version-pill">v5</span>
                    </a>
                </div>
                <div class="header-right">
                    <span id="statusPill" class="status-pill success">
                        <i class="bi bi-check2"></i>
                        <span id="statusText">Ready ✓</span>
                    </span>
                    <div class="header-divider"></div>
                    <span class="pane-file-pill">
                        <i class="bi bi-layout-split"></i>
                        <span>3 Panes Active</span>
                    </span>
                </div>
            </header>
            <main class="studio-workspace" data-panes="3">
                <section id="pane1" class="studio-pane" data-pane-key="instructions">
                    <header class="pane-region pane-header pane-header--file-picker" data-region="header" data-type="file-picker">
                        <div class="pane-header__left">
                            <span class="pane-label">Instructions</span>
                            <button id="openFileBtn1" type="button" class="btn-pane-file" title="Choose a file for Instructions">
                                <i class="bi bi-folder2-open" aria-hidden="true"></i>
                                <span>Select File</span>
                            </button>
                            <input type="file" id="fileInput1" class="pane-file-input" accept=".json,.js,.txt,application/json">
                        </div>
                        <div class="pane-header__right">
                            <span class="pane-file-pill">
                                <i class="bi bi-filetype-json" aria-hidden="true"></i>
                                <span id="fileName1" class="pane-file-name">instructions.json</span>
                            </span>
                        </div>
                    </header>
                    <div id="editor1" class="pane-region pane-body pane-body--monaco" data-region="body" data-type="monaco" data-language="json"></div>
                    <footer id="paneCursor1" class="pane-region pane-footer pane-footer--cursor" data-region="footer" data-type="cursor">Ln 1, Col 1</footer>
                </section>
                <section id="pane2" class="studio-pane" data-pane-key="data">
                    <header class="pane-region pane-header pane-header--file-picker" data-region="header" data-type="file-picker">
                        <div class="pane-header__left">
                            <span class="pane-label">Data</span>
                            <button id="openFileBtn2" type="button" class="btn-pane-file" title="Choose a file for Data">
                                <i class="bi bi-folder2-open" aria-hidden="true"></i>
                                <span>Select File</span>
                            </button>
                            <input type="file" id="fileInput2" class="pane-file-input" accept=".json,.js,.txt,application/json">
                        </div>
                        <div class="pane-header__right">
                            <span class="pane-file-pill">
                                <i class="bi bi-filetype-json" aria-hidden="true"></i>
                                <span id="fileName2" class="pane-file-name">data.json</span>
                            </span>
                        </div>
                    </header>
                    <div id="editor2" class="pane-region pane-body pane-body--monaco" data-region="body" data-type="monaco" data-language="json"></div>
                    <footer class="pane-region pane-footer pane-footer--note" data-region="footer" data-type="note">Source data • editable JSON</footer>
                </section>
                <section id="pane3" class="studio-pane" data-pane-key="output">
                    <header class="pane-region pane-header pane-header--title" data-region="header" data-type="title">
                        <span class="pane-label">Output</span>
                    </header>
                    <div id="editor3" class="pane-region pane-body pane-body--monaco" data-region="body" data-type="monaco" data-language="json"></div>
                </section>
            </main>
            <footer class="studio-footer">
                <div class="footer-left">
                    <span class="footer-brand">
                        <i class="bi bi-braces-asterisk"></i>
                        <span>JSON-Driven Monaco Studio</span>
                    </span>
                    <span>|</span>
                    <span id="layoutMeta">3 Panes Active</span>
                </div>
                <div class="footer-right">
                    <span id="cursorPos">Ln 1, Col 1</span>
                </div>
            </footer>
        </div>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script>
        <script type="module" src="./js/index.js"></script>
    </body>
</html>
